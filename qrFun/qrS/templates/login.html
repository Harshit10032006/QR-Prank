{% extends 'base.html' %}
{% block title %}Login - QR Fun{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 p-md-5">
            <h2 class="fw-bold text-center mb-4">Welcome Back 👋</h2>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="you@gmail.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
            </form>

            <p class="text-center mt-4 text-muted">
                Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
