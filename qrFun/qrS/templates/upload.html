{% extends 'base.html' %}
{% block title %}Upload - QR Fun{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 p-md-5">
            <h2 class="fw-bold text-center mb-4">Create a New QR Code </h2>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Label</label>
                    <input type="text" name="label" class="form-control" placeholder="Scan for Menu" value="Scan for Menu">
                </div>
                <div class="mb-4">
                    <label class="form-label">Photo or Video</label>
                    <input type="file" name="file" class="form-control" accept="image/*,video/*" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Generate QR Code</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
